<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>点検記録</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;}
input,textarea{-webkit-user-select:auto;user-select:auto;}
body{font-family:-apple-system,sans-serif;background:#1a1a2e;color:#fff;min-height:100vh;}
.hd{background:#16213e;padding:12px;text-align:center;position:sticky;top:0;z-index:100;border-bottom:2px solid #e94560;}
.hd h1{font-size:16px;color:#e94560;}
.hd .pi{font-size:18px;color:#0ff;margin-top:6px;font-weight:bold;}
.hd .mi{font-size:12px;color:#888;margin-top:2px;}
.tabs{display:flex;background:#16213e;position:sticky;top:72px;z-index:99;}
.tb{flex:1;padding:12px;text-align:center;font-size:14px;color:#888;cursor:pointer;border-bottom:3px solid transparent;}
.tb.on{color:#e94560;border-bottom-color:#e94560;font-weight:bold;}
.sc{display:none;padding:12px;padding-bottom:80px;}
.sc.on{display:block;}
.vbtn{width:100%;padding:20px;border-radius:16px;border:none;font-size:20px;font-weight:bold;cursor:pointer;margin-bottom:10px;}
.vbtn.off{background:#e94560;color:#fff;}
.vbtn.rec{background:#00c853;color:#fff;animation:pls 1s infinite;}
@keyframes pls{0%,100%{opacity:1;}50%{opacity:.6;}}
.csb{background:#0a3d62;border:2px solid #0ff;border-radius:12px;padding:14px;margin-bottom:10px;text-align:center;}
.csb .n{font-size:36px;font-weight:bold;color:#0ff;}
.csb .s{font-size:12px;color:#88ccff;margin-top:4px;}
.lr{background:#16213e;border-radius:12px;padding:14px;margin-bottom:10px;text-align:center;min-height:70px;border:1px solid #333;}
.lr .l{font-size:12px;color:#888;}
.lr .v{font-size:26px;font-weight:bold;color:#0ff;margin-top:6px;word-break:break-all;}
.lr .r{font-size:11px;color:#666;margin-top:4px;word-break:break-all;}
.lr .v.ok{color:#00e676;}
.lr .v.ng{color:#ff5555;}
.pb{background:#16213e;border-radius:8px;padding:10px;margin-bottom:10px;text-align:center;font-size:13px;}
.pbr{background:#333;border-radius:4px;height:8px;margin-top:6px;}
.pbf{background:linear-gradient(90deg,#e94560,#00c853);height:8px;border-radius:4px;transition:width .3s;}
.gr{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-bottom:10px;}
.gc{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px;font-size:10px;font-weight:bold;cursor:pointer;}
.gc.e{background:#2a2a4a;color:#666;}
.gc.f{background:#0a6640;color:#fff;}
.gc.c{background:#e94560;color:#fff;box-shadow:0 0 8px #e94560;}
.gc .cv{font-size:8px;color:#aff;margin-top:1px;}
.nb{display:flex;gap:8px;margin-bottom:10px;}
.bt{padding:14px 16px;border-radius:10px;border:none;font-size:14px;font-weight:bold;cursor:pointer;text-align:center;}
.bt.p{background:#e94560;color:#fff;width:100%;margin-top:8px;}
.bt.s{background:#333;color:#fff;flex:1;}
.bt.n{background:#0a6640;color:#fff;flex:1;}
.bt.x{background:#1565c0;color:#fff;width:100%;margin-top:8px;}
.bt.g{background:#00838f;color:#fff;width:100%;margin-top:8px;}
.bt.r{background:#c62828;color:#fff;width:100%;margin-top:8px;}
.bt.pu{background:#7b1fa2;color:#fff;width:100%;margin-top:8px;}
.vh{background:#1a1a3e;border:1px solid #444;border-radius:8px;padding:10px;margin-bottom:10px;font-size:11px;color:#aaa;line-height:1.5;}
.vh b{color:#0ff;}
.dtw{overflow-x:auto;margin-bottom:12px;}
.dt{width:100%;border-collapse:collapse;font-size:12px;}
.dt th{background:#e94560;color:#fff;padding:8px 4px;position:sticky;top:0;z-index:10;}
.dt td{background:#16213e;padding:8px 4px;text-align:center;border:1px solid #333;cursor:pointer;}
.dt td.hv{color:#0ff;font-weight:bold;}
.dt td.nv{color:#555;}
.dt tr:nth-child(even) td{background:#1a1a3e;}
.sg{background:#16213e;border-radius:12px;padding:14px;margin-bottom:12px;}
.sg h3{font-size:14px;color:#e94560;margin-bottom:10px;}
.sr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sr label{font-size:13px;color:#ccc;}
.sr input{width:90px;padding:7px;border-radius:8px;border:1px solid #444;background:#2a2a4a;color:#fff;text-align:center;font-size:16px;}
.sr input.w{width:160px;}
.mo{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:200;align-items:center;justify-content:center;}
.mo.sh{display:flex;}
.md{background:#16213e;border-radius:16px;padding:24px;width:90%;max-width:320px;border:2px solid #e94560;}
.md h3{color:#e94560;margin-bottom:14px;text-align:center;}
.md input{width:100%;padding:14px;font-size:28px;text-align:center;border-radius:8px;border:2px solid #e94560;background:#2a2a4a;color:#fff;margin-bottom:14px;}
.mb{display:flex;gap:10px;}
.mb .bt{flex:1;padding:14px;}
.bt.ca{background:#555;color:#fff;}
.bt.sv{background:#e94560;color:#fff;}
.bt.dl{background:#c62828;color:#fff;width:100%;margin-top:8px;padding:10px;font-size:12px;}
.sm{position:fixed;bottom:16px;left:12px;right:12px;text-align:center;padding:10px;font-size:13px;color:#fff;background:rgba(0,0,0,.85);border-radius:8px;z-index:300;display:none;}
.sm.sh{display:block;}
.pi2{display:flex;gap:8px;margin-bottom:8px;}
.pi2 .bt{font-size:12px;padding:8px 10px;}
.pi2 .bl{flex:1;background:#2a2a4a;color:#fff;text-align:left;}
.pi2 .bd{background:#c62828;color:#fff;}
.dbg{background:#0d0d1a;border:1px solid #333;border-radius:8px;padding:8px;margin-bottom:10px;font-size:10px;color:#666;max-height:80px;overflow-y:auto;word-break:break-all;}
.divider{border:none;border-top:1px solid #333;margin:12px 0;}
.slot-card{background:#16213e;border:2px solid #333;border-radius:12px;padding:14px;margin-bottom:10px;position:relative;}
.slot-card.used{border-color:#0a6640;}
.slot-card.empty{border-color:#333;opacity:0.7;}
.slot-title{font-size:13px;color:#e94560;font-weight:bold;margin-bottom:6px;}
.slot-info{font-size:12px;color:#aaa;line-height:1.6;}
.slot-info .mc{color:#0ff;font-weight:bold;font-size:14px;}
.slot-info .prog{color:#00e676;}
.slot-info .dt2{color:#888;font-size:11px;}
.slot-btns{display:flex;gap:8px;margin-top:10px;}
.slot-btns .bt{flex:1;padding:10px;font-size:13px;margin-top:0;}
.bt.load{background:#0a3d62;color:#0ff;border:1px solid #0ff;}
.bt.save2{background:#0a6640;color:#fff;}
.bt.del2{background:#c62828;color:#fff;}
</style>
</head>
<body>
<div class="hd">
<h1>📋 点検記録</h1>
<div class="pi" id="ptInfo">1点目（5枚目）</div>
<div class="mi" id="mcInfo">デフォルト</div>
</div>
<div class="tabs">
<div class="tb on" onclick="switchTab(0)">🎙 入力</div>
<div class="tb" onclick="switchTab(1)">🇮🇹 一覧</div>
<div class="tb" onclick="switchTab(2)">🗂 休存</div>
<div class="tb" onclick="switchTab(3)">⚙️ 設定</div>
</div>
<div class="sc on" id="sc0">
<button class="vbtn off" id="vBtn" onclick="togV()">🎙 音声入力 開始</button>
<div class="csb"><div class="n" id="ptLbl">1点目</div><div class="s" id="ptSub">5枚目</div></div>
<div class="lr"><div class="l">認識結果</div><div class="v" id="lrVal">待機中...</div><div class="r" id="lrRaw"></div></div>
<div class="pb"><span id="pbTxt">0 / 72</span><div class="pbr"><div class="pbf" id="pbBar" style="width:0%"></div></div></div>
<div class="gr" id="grid"></div>
<div class="nb">
<button class="bt s" onclick="prevPt()">⬅ 前の点</button>
<button class="bt n" onclick="nextPt()">次の点 ➡</button>
</div>
<button class="bt x" onclick="doCSV()">📨 CSV出力</button>
<div class="dbg" id="dbg"></div>
</div>
<div class="sc" id="sc1">
<div class="vh">💡 <b>タップ</b>で手動入力・修正できます</div>
<div class="dtw"><table class="dt" id="tbl"></table></div>
</div>
<div class="sc" id="sc2">
<div class="sg"><h3>💾 セーブ・ロード</h3><div id="slotList"></div></div>
<hr class="divider">
<button class="bt r" onclick="doReset()">🗑 データリセット</button>
</div>
<div class="sc" id="sc3">
<div class="sg">
<h3>⚙️ 基本設定</h3>
<div class="sr"><label>機種名</label><input type="text" id="inMc" class="w" value="デフォルト"></div>
<div class="sr"><label>No.総数</label><input type="number" id="inSl" value="72" min="1"></div>
<div class="sr"><label>測定点数</label><input type="number" id="inPt" value="3" min="1" max="10" onchange="buildPtUI()"></div>
</div>
<div class="sg"><h3>📍 測定点位置</h3><div id="ptSet"></div></div>
<button class="bt p" onclick="doApply()">✅ 設定適用</button>
<hr class="divider">
<div class="sg"><h3>📂 プリセット</h3><div id="prList"></div></div>
<button class="bt g" onclick="doSavePreset()">💾 現在の設定をプリセット保存</button>
</div>
<div class="mo" id="modal">
<div class="md">
<h3>手動入力 <span id="mNo"></span></h3>
<input type="number" id="mVal" placeholder="数値を入力">
<div class="mb">
<button class="bt ca" onclick="closeMo()">キャンセル</button>
<button class="bt sv" onclick="saveMo()">保存</button>
</div>
<button class="bt dl" onclick="delMo()">🗑 この数値を削除</button>
</div>
</div>
<div class="sm" id="stMsg"></div>
<script>
var C={mc:'デフォルト',ts:72,np:3,pp:[5,13,19]};
var D=[],cp=0,listening=false,rec=null,stT=null,mSlot=null,errCount=0;
function initD(){D=[];for(var i=0;i<C.np;i++)D.push({});}
function switchTab(i){
var ss=document.querySelectorAll('.sc'),ts=document.querySelectorAll('.tb');
for(var j=0;j<ss.length;j++){ss[j].classList.remove('on');ts[j].classList.remove('on');}
ss[i].classList.add('on');ts[i].classList.add('on');
if(i===1)renderTbl();if(i===2)renderSlots();
}
function updAll(){
var pt=C.pp[cp]||'-';
document.getElementById('ptInfo').textContent=(cp+1)+'点目（'+pt+'枚目）';
document.getElementById('mcInfo').textContent=C.mc;
document.getElementById('ptLbl').textContent=(cp+1)+'点目';
document.getElementById('ptSub').textContent=pt+'枚目';
var f=cntF(),t=C.ts;
document.getElementById('pbTxt').textContent=f+' / '+t;
document.getElementById('pbBar').style.width=(t>0?Math.round(f/t*100):0)+'%';
renderGrid();
}
function cntF(){var c=0;for(var k in D[cp])if(D[cp][k]!==null&&D[cp][k]!==undefined)c++;return c;}
function renderGrid(){
var g=document.getElementById('grid'),h='';
for(var i=1;i<=C.ts;i++){
var v=D[cp][i];
var cls=v!==undefined&&v!==null?'gc f':'gc e';
if(i===(cp===0?1:1)){}
h+='<div class="'+cls+'" onclick="openMo('+i+')">';
h+=i;
if(v!==undefined&&v!==null)h+='<div class="cv">'+v+'</div>';
h+='</div>';
}
g.innerHTML=h;
}
function togV(){
listening=!listening;
var b=document.getElementById('vBtn');
if(listening){b.className='vbtn rec';b.textContent='🔴 録音中... タップで停止';errCount=0;doStart();}
else{b.className='vbtn off';b.textContent='🎙 音声入力 開始';if(rec){try{rec.stop();}catch(x){}rec=null;}}
}
function doStart(){
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR||!listening)return;
try{
rec=new SR();
rec.lang='ja-JP';
rec.continuous=false;
rec.interimResults=false;
rec.maxAlternatives=1;
rec.onstart=function(){errCount=0;log('再開OK');};
rec.onresult=function(e){
if(e.results.length>0&&e.results[0].isFinal){
var t=e.results[0][0].transcript.trim();
log('認識: '+t);
procVoice(t);
}
};
rec.onerror=function(e){
if(e.error==='not-allowed'){listening=false;
var b=document.getElementById('vBtn');b.className='vbtn off';b.textContent='🎙 音声入力 開始';return;}
if(e.error==='aborted'){
errCount++;
if(errCount>10){
log('音声認識を一時停止します');
setTimeout(function(){errCount=0;if(listening)doStart();},3000);
return;
}
}else{
log('エラー: '+e.error);
}
if(listening){setTimeout(function(){if(listening)doStart();},500);}
};
rec.onend=function(){
if(listening){setTimeout(function(){if(listening)doStart();},300);}
};
rec.start();
}catch(ex){
log('例外: '+ex.message);
if(listening){setTimeout(function(){if(listening)doStart();},1000);}
}
}
function log(m){
var d=document.getElementById('dbg');
if(!d)return;
var lines=d.textContent.split('\n').filter(function(l){return l.length>0;});
if(lines.length>30){lines=lines.slice(-20);}
lines.push(m);
d.textContent=lines.join('\n')+'\n';
d.scrollTop=d.scrollHeight;
}
function procVoice(n){
var corr=false;
if(n.indexOf('訂正')>=0||n.indexOf('修正')>=0||n.indexOf('戻')>=0){corr=true;}
var es=cp+1;
var pats=[
/ナンバー\D*(\d+)\D+(\d+)/,
/[Nn][Oo]\.?\s*(\d+)\D+(\d+)/,
/(\d+)\s*番\D*(\d+)/,
/(\d+)\D+(\d+)/
];
for(var i=0;i<pats.length;i++){
var m2=n.match(pats[i]);
if(m2){
var s2=parseInt(m2[1]),v2=parseInt(m2[2]);
if(s2>=1&&s2<=C.ts){recVal(s2,v2,corr);return;}
}
}
var sn=n.match(/(\d+)/);
if(sn){recVal(es,parseInt(sn[1]),corr);return;}
setResult('❌ 認識できません','ng');
spk('認識できませんでした');
}
function recVal(slot,val,corr){
if(!corr&&D[cp][slot]!==undefined&&D[cp][slot]!==null){
setResult('⚠️ No.'+slot+' 記録済み','ng');
spk('No.'+slot+'はすでに記録されています。訂正コマンドを使ってください');
return;
}
D[cp][slot]=val;
var act=corr?'訂正':'記録';
setResult('No.'+slot+' → '+val,'ok');
spk('ナンバー'+slot+' '+val+'を'+act+'しました');
svData();updAll();
if(cntF()>=C.ts){
if(cp<C.np-1){
spk('測定完了。次の測定点に移ります。');
setTimeout(function(){nextPt();},2000);
}else{
spk('全測定完了。お疲れ様でした。');
showSt('🎉 全測定完了！');
}
}
}
function setResult(txt,cls){
var el=document.getElementById('lrVal');
el.textContent=txt;
el.className='v'+(cls?' '+cls:'');
if(cls)setTimeout(function(){el.className='v';},3000);
}
function spk(t){
if(!window.speechSynthesis)return;
try{
window.speechSynthesis.cancel();
var u=new SpeechSynthesisUtterance(t);
u.lang='ja-JP';u.rate=1.1;
window.speechSynthesis.speak(u);
}catch(x){}
}
function nextPt(){if(cp<C.np-1){cp++;svData();updAll();spk((cp+1)+'点目');}}
function prevPt(){if(cp>0){cp--;svData();updAll();spk((cp+1)+'点目');}}
function openMo(s){
mSlot=s;
document.getElementById('mNo').textContent='No.'+s;
document.getElementById('mVal').value=D[cp][s]!==undefined&&D[cp][s]!==null?D[cp][s]:'';
document.getElementById('modal').classList.add('sh');
setTimeout(function(){document.getElementById('mVal').focus();},100);
}
function closeMo(){document.getElementById('modal').classList.remove('sh');mSlot=null;}
function saveMo(){
if(mSlot===null)return;
var v=document.getElementById('mVal').value;
if(v===''){delMo();return;}
D[cp][mSlot]=parseInt(v);
svData();updAll();closeMo();showSt('✅ No.'+mSlot+' 保存');
}
function delMo(){
if(mSlot===null)return;
if(!confirm('No.'+mSlot+'の数値を削除しますか？'))return;
delete D[cp][mSlot];
svData();updAll();closeMo();showSt('🗑 No.'+mSlot+' 削除');
}
function doReset(){
if(!confirm('全データをリセットしますか？'))return;
initD();cp=0;svData();updAll();showSt('🗑 リセット完了');
}
function renderTbl(){
var h='<tr><th>No.</th>';
for(var p=0;p<C.np;p++)h+='<th>'+C.pp[p]+'枚目</th>';
h+='</tr>';
for(var i=1;i<=C.ts;i++){
h+='<tr>';
h+='<td>'+i+'</td>';
for(var p2=0;p2<C.np;p2++){
var v=D[p2][i];
var cls=v!==undefined&&v!==null?'hv':'nv';
h+='<td class="'+cls+'" onclick="switchTab(0);cp='+p2+';updAll();openMo('+i+')">';
h+=(v!==undefined&&v!==null?v:'-')+'</td>';
}
h+='</tr>';
}
document.getElementById('tbl').innerHTML=h;
}
function renderSlots(){
var h='';
for(var i=1;i<=5;i++){
var sd=localStorage.getItem('wslot'+i);
if(sd){
try{
var obj=JSON.parse(sd);
var prog=0,total=0;
for(var p=0;p<obj.C.np;p++){for(var k in obj.D[p])prog++;total+=obj.C.ts;}
h+='<div class="slot-card used">';
h+='<div class="slot-title">スロット '+i+'</div>';
h+='<div class="slot-info"><span class="mc">'+obj.C.mc+'</span><br>';
h+='<span class="prog">'+prog+' / '+total+' 完了</span><br>';
h+='<span class="dt2">'+obj.saved+'</span></div>';
h+='<div class="slot-btns">';
h+='<button class="bt load" onclick="ldSlot('+i+')">📂 ロード</button>';
h+='<button class="bt save2" onclick="svSlot('+i+')">💾 上書</button>';
h+='<button class="bt del2" onclick="delSlot('+i+')">🗑</button>';
h+='</div></div>';
}catch(x){h+=emptySlot(i);}
}else{h+=emptySlot(i);}
}
document.getElementById('slotList').innerHTML=h;
}
function emptySlot(i){
return '<div class="slot-card empty"><div class="slot-title">スロット '+i+'</div><div class="slot-info" style="color:#555;">空のスロット</div><div class="slot-btns"><button class="bt save2" onclick="svSlot('+i+')">💾 保存</button></div></div>';
}
function svSlot(i){
var obj={C:JSON.parse(JSON.stringify(C)),D:JSON.parse(JSON.stringify(D)),cp:cp,saved:new Date().toLocaleString('ja-JP')};
localStorage.setItem('wslot'+i,JSON.stringify(obj));
renderSlots();showSt('💾 スロット'+i+'に保存');
}
function ldSlot(i){
if(!confirm('スロット'+i+'をロードしますか？'))return;
var sd=localStorage.getItem('wslot'+i);
if(!sd)return;
try{
var obj=JSON.parse(sd);
C=obj.C;D=obj.D;cp=obj.cp||0;
document.getElementById('inMc').value=C.mc;
document.getElementById('inSl').value=C.ts;
document.getElementById('inPt').value=C.np;
buildPtUI();updAll();svData();renderSlots();
showSt('📂 スロット'+i+'をロード');
switchTab(0);
}catch(x){showSt('❌ ロード失敗');}
}
function delSlot(i){
if(!confirm('スロット'+i+'を削除？'))return;
localStorage.removeItem('wslot'+i);
renderSlots();showSt('🗑 スロット'+i+'削除');
}
function buildPtUI(){
var c=document.getElementById('ptSet'),np=parseInt(document.getElementById('inPt').value)||3,h='';
for(var i=0;i<np;i++){
var v=C.pp[i]||(i*5+5);
h+='<div class="sr"><label>'+(i+1)+'点目</label><input type="number" class="ppi" value="'+v+'" min="1"> 枚目</div>';
}
c.innerHTML=h;
}
function doApply(){
if(!confirm('設定を適用してデータ初期化しますか？'))return;
C.mc=document.getElementById('inMc').value||'デフォルト';
C.ts=parseInt(document.getElementById('inSl').value)||72;
C.np=parseInt(document.getElementById('inPt').value)||3;
var ps=document.querySelectorAll('.ppi');
C.pp=[];for(var i=0;i<ps.length;i++)C.pp.push(parseInt(ps[i].value)||(i*5+5));
initD();updAll();buildPtUI();svCfg();svData();
switchTab(0);
spk('設定を適用しました');showSt('✅ 設定適用');
}
function doSavePreset(){
var nm=C.mc;
if(!nm||nm==='デフォルト'){nm=prompt('プリセット名',C.mc);if(!nm)return;}
var pr=JSON.parse(localStorage.getItem('wp')||'{}');
pr[nm]={mc:nm,ts:C.ts,np:C.np,pp:C.pp.slice()};
localStorage.setItem('wp',JSON.stringify(pr));renderPr();showSt('💾 保存: '+nm);
}
function loadPr(nm){
var pr=JSON.parse(localStorage.getItem('wp')||'{}');
if(!pr[nm])return;var p=pr[nm];
document.getElementById('inMc').value=p.mc;
document.getElementById('inSl').value=p.ts;
document.getElementById('inPt').value=p.np;
C.pp=p.pp.slice();buildPtUI();showSt('📂 '+nm+'を読込');
}
function delPr(nm){
if(!confirm(nm+'を削除？'))return;
var pr=JSON.parse(localStorage.getItem('wp')||'{}');
delete pr[nm];localStorage.setItem('wp',JSON.stringify(pr));renderPr();
}
function renderPr(){
var pr=JSON.parse(localStorage.getItem('wp')||'{}'),c=document.getElementById('prList'),ks=Object.keys(pr);
if(!ks.length){c.innerHTML='<p style="color:#666;font-size:11px;">プリセットなし</p>';return;}
var h='';
for(var i=0;i<ks.length;i++){
var n=ks[i];
h+='<div class="pi2"><button class="bt bl" onclick="loadPr(\''+n.replace(/'/g,"\\'")+'\')">📂 '+n+'</button>';
h+='<button class="bt bd" onclick="delPr(\''+n.replace(/'/g,"\\'")+'\')">🗑</button></div>';
}
c.innerHTML=h;
}
function doCSV(){
var h='No.';
for(var p=0;p<C.np;p++)h+=','+C.pp[p]+'枚目';
var rows=[h];
for(var i=1;i<=C.ts;i++){
var r=String(i);
for(var p2=0;p2<C.np;p2++)r+=','+(D[p2][i]!==undefined&&D[p2][i]!==null?D[p2][i]:'');
rows.push(r);
}
var csv=rows.join('\n');
var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;a.download=C.mc+'_点検記録.csv';
document.body.appendChild(a);a.click();
document.body.removeChild(a);URL.revokeObjectURL(url);
showSt('📥 CSV出力完了');
}
function svData(){try{localStorage.setItem('wd',JSON.stringify(D));localStorage.setItem('wcp',String(cp));localStorage.setItem('wc',JSON.stringify(C));}catch(x){}}
function svCfg(){try{localStorage.setItem('wc',JSON.stringify(C));}catch(x){}}
function ldSaved(){
try{
var sc=localStorage.getItem('wc');
if(sc){var c=JSON.parse(sc);C.mc=c.mc||'デフォルト';C.ts=c.ts||72;C.np=c.np||3;C.pp=c.pp||[5,13,19];
document.getElementById('inMc').value=C.mc;document.getElementById('inSl').value=C.ts;document.getElementById('inPt').value=C.np;}
initD();
var sd=localStorage.getItem('wd');
if(sd){var pd=JSON.parse(sd);for(var p=0;p<C.np;p++){if(pd[p])for(var k in pd[p])D[p][k]=pd[p][k];}}
var sp=localStorage.getItem('wcp');
if(sp!==null){cp=parseInt(sp);if(cp>=C.np)cp=0;}
}catch(x){initD();}
}
function showSt(m){
var el=document.getElementById('stMsg');el.textContent=m;el.classList.add('sh');
if(stT)clearTimeout(stT);stT=setTimeout(function(){el.classList.remove('sh');},3000);
}
window.onload=function(){ldSaved();updAll();buildPtUI();renderPr();};
</script>
