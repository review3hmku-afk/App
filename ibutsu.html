<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>異物管理対策</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif; background: #f0f4f8; }

  .print-btn {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    background: #2563eb; color: white; border: none; padding: 10px 24px;
    border-radius: 8px; font-size: 15px; cursor: pointer; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .page { 
    max-width: 800px; margin: 60px auto 0; padding: 16px;
  }

  /* タイトルページ */
  .title-slide {
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%);
    border-radius: 16px; padding: 48px 24px; text-align: center;
    color: white; margin-bottom: 24px;
  }
  .title-slide .icon { font-size: 48px; margin-bottom: 16px; }
  .title-slide h1 { font-size: 26px; font-weight: bold; margin-bottom: 8px; }
  .title-slide p { font-size: 13px; opacity: 0.85; margin-bottom: 20px; }
  .title-tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .title-tags span {
    border: 1px solid rgba(255,255,255,0.5); border-radius: 20px;
    padding: 4px 12px; font-size: 12px;
  }

  /* セクションヘッダー */
  .section-header {
    background: linear-gradient(90deg, #1e3a8a, #2563eb);
    color: white; border-radius: 10px; padding: 14px 18px;
    margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
  }
  .section-header .slide-num {
    font-size: 10px; opacity: 0.7; display: block;
  }
  .section-header h2 { font-size: 18px; font-weight: bold; }

  /* カード */
  .card {
    background: white; border-radius: 12px; padding: 16px;
    margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  /* 2カラム */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }

  .col-red { background: #fff5f5; border-radius: 10px; padding: 14px; border-left: 4px solid #ef4444; }
  .col-green { background: #f0fdf4; border-radius: 10px; padding: 14px; border-left: 4px solid #22c55e; }
  .col-blue { background: #eff6ff; border-radius: 10px; padding: 14px; border-left: 4px solid #3b82f6; }
  .col-yellow { background: #fefce8; border-radius: 10px; padding: 14px; border-left: 4px solid #eab308; }

  .col-title { font-size: 13px; font-weight: bold; margin-bottom: 8px; }
  .col-title.red { color: #ef4444; }
  .col-title.green { color: #22c55e; }
  .col-title.blue { color: #2563eb; }
  .col-title.yellow { color: #ca8a04; }

  ul { padding-left: 16px; }
  li { font-size: 13px; margin-bottom: 4px; line-height: 1.6; }

  /* イラスト */
  .illust { width: 100%; border-radius: 10px; margin: 12px 0; object-fit: cover; }
  .illust-half { width: 100%; border-radius: 10px; object-fit: cover; }

  /* 注意書き */
  .note {
    background: #fef9c3; border-left: 4px solid #eab308;
    border-radius: 8px; padding: 12px 14px; font-size: 12px;
    color: #713f12; margin: 12px 0; line-height: 1.6;
  }

  /* テーブル */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #1e3a8a; color: white; padding: 8px; text-align: left; }
  td { padding: 8px; border-bottom: 1px solid #e5e7eb; }
  tr:nth-child(even) { background: #f8fafc; }

  /* まとめボックス */
  .summary-box {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: white; border-radius: 12px; padding: 20px; margin-bottom: 16px;
    text-align: center;
  }
  .summary-box h3 { font-size: 16px; margin-bottom: 8px; }
  .summary-box p { font-size: 13px; opacity: 0.9; line-height: 1.6; }

  .footer {

    padding: 8px 0 24px;
